<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: "Times New Roman", serif;
            background-color: white;
        }

        .container {
            border: 6px solid #dce1e4;
            padding: 40px 90px;
            margin: 50px auto;
            max-width: 780px;
        }
         h1 {
            font-size: 58px;
            margin-top: 0;
            margin-bottom: 65px;
        }
        p {
            font-size: 30px;
            margin-bottom: 30px;
        }
         label {
            font-size: 28px;
            font-weight: bold;
            display: block;
        }

      input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 6px;
            font-size: 25px;
            margin-bottom: 2px;
        }
         button {
            width: 100%;
            padding: 5px;
            font-size: 25px;
            cursor: pointer;
        }
        .login {
            text-align: center;
            margin-top: 28px;
            font-size: 28px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 25px 20px;
                margin: 20px auto;
            }

            h1 {
                font-size: 42px;
                margin-bottom: 40px;
            }

            p {
                font-size: 22px;
            }

            label {
                font-size: 22px;
            }

            input[type="text"],
            input[type="email"],
            input[type="password"],
            button {
                font-size: 18px;
            }

            .login {
                font-size: 20px;
            }
        }


    </style>
</head>
<body>
    <div class="container">
    <h1>Register</h1>
    <p>Kindly fill in this form to register.</p>
    <form>
        <label for="username">Username</label>
            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter username"
                required
            >

         <label for="email">Email</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter Email"
                required
            >
           <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter Password"
                required
            >
               <label for="repeatPassword">Repeat Password</label>
            <input
                type="password"
                id="repeatPassword"
                name="repeatPassword"
                placeholder="Repeat Password"
                required
            >
            <button type="submit">Register</button>
            
            <div class="login">
                Already have an account?
            <a href="login.html">Log in</a>.
            </div>
    </form>
    </div>
    
</body>
</html>
