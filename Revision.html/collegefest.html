
<!DOCTYPE html>
<html>
<head>
    <style>

h1 {
    color: #0f0505;
    text-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
    margin-bottom: 20px;
    
}

form {
    background: #ffffff;
    width: 100%;
    max-width: 480px;
    padding: 30px;
    border-radius: 14px;
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.15);
    
    
}

label {
    display: block;
    font-weight: 600;
    margin-bottom: 6px;
    color: #333;
    font-size: 0.95rem;
}

input[type="text"],
input[type="email"],
input[type="tel"],
input[type="date"],
select {
    width: 100%;
    padding: 10px 12px;
    border: 1.5px solid #cbd5e0;
    border-radius: 8px;
    font-size: 0.95rem;
    outline: none;
    transition: border-color 0.3s ease, box-shadow 0.3s ease;
}


input[type="submit"],
input[type="reset"] {
    width: 48%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.2s ease, opacity 0.3s ease;
}

input[type="submit"] {
    background: #f68065;
    color: #fff;
    margin-right: 2%;
}

input[type="reset"] {
    background: #edf2f7;
    color: #4a5568;
}

input[type="submit"]:hover,
input[type="reset"]:hover {
    transform: translateY(-2px);
    opacity: 0.92;
}
</style>
    <title>College Fest Registration</title>
</head>
<body>
    <h1>College Fest Registration Form</h1>

    <form>
        <label>Full Name:</label>
        <input type="text" required><br><br>

        <label>Email:</label>
        <input type="email" required><br><br>

        <label>Phone:</label>
        <input type="tel" required><br><br>

        <label>Gender:</label>
        <input type="radio" name="gender"> Male
        <input type="radio" name="gender"> Female
        <input type="radio" name="gender"> Other
        <br><br>

        <label>Select Course:</label>
        <select>
            <option>B.Tech</option>
            <option>BSc</option>
            <option>BCom</option>
            <option>BA</option>
        </select>
        <br><br>

        <label>Select Event:</label>
        <select>
            <option>Dance</option>
            <option>Singing</option>
            <option>Sports</option>
            <option>Quiz</option>
            <option>Photography</option>
        </select>
        <br><br>

        <label>Event Date:</label>
        <input type="date"><br><br>

        <input type="submit" value="Submit Registration">
        <input type="reset" value="Reset">
    </form>
</body>
</html>
